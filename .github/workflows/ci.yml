name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit public files and dependency checksums
        run: python3 Scripts/audit-publication.py
      - name: Test publication safeguards
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run unit tests without a device
        run: >-
          xcodebuild -project MTPExplorer.xcodeproj -scheme MTPExplorer
          -configuration Debug -destination 'platform=macOS'
          -derivedDataPath build-tests test
      - name: Build Universal Release
        run: >-
          xcodebuild -project MTPExplorer.xcodeproj -scheme MTPExplorer
          -configuration Release -derivedDataPath build-release
          'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
      - name: Verify bundled application signature
        run: codesign --verify --deep --strict build-release/Build/Products/Release/MTPExplorer.app
